<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <table>
            <tr>
                <td>Full Name</td>
                <td><input type="text" size="40" required/></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" size="40" required/></td>
            </tr>
            <tr>
                <td>Mobile</td>
                <td><input type="tel" pattern="[6-9][0-9]{9}" size="40" required > </td>
            </tr>
            <tr>
                <td>Address</td>
                <td align="left"><textarea rows="4" cols="38" required></textarea></td>
            </tr>
            <tr>
                <td> Date of Birth </td>
                <td align="left" ><input type="date" required/></td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" align="center"/>
                <input type="button" value="Cancel"  /></td>
            </tr>
            
        </table>
    </form>
</body>
</html>
