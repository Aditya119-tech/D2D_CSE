<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Favorites | Cinemax</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Header -->
    <header class="site-header">

        <div class="container nav-wrap">


            <a href="index.html"
                class="logo">

                Cine<span>max</span>

            </a>


            <button
                class="menu-btn"
                id="menuBtn">

                ☰

            </button>


            <nav id="mainNav">

                <a href="index.html">
                    Home
                </a>


                <a href="movies.html">
                    Movies
                </a>


                <a
                    href="favorites.html"
                    class="active">

                    Favorites

                </a>


                <a href="reviews.html">
                    Reviews
                </a>


                <a href="contact.html">
                    Contact
                </a>


                <button
                    class="theme-btn"
                    id="themeBtn">

                    ☾

                </button>

            </nav>

        </div>

    </header>



    <!-- Favorites Page -->
    <main class="page">

        <div class="container">


            <div class="page-title">

                <p class="eyebrow">
                    YOUR LIST
                </p>


                <h1>
                    Favorites
                </h1>


                <p>
                    Movies you decided to keep close.
                </p>

            </div>



            <div
                class="movie-grid"
                id="favoritesGrid">

                <!-- Favorite movies
                     displayed here -->

            </div>



            <div
                class="empty"
                id="favoriteEmpty">

                Your favorites list is empty.

                <br>

                Add a movie using
                the ♡ button.

            </div>


        </div>

    </main>



    <!-- Footer -->
    <footer>

        <div class="container">

            © 2026 Cinemax • Movie Information Portal

        </div>

    </footer>



    <script src="movies.js"></script>

    <script src="app.js"></script>

    <script src="favorites.js"></script>
