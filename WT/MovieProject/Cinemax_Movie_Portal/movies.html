<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movies | Cinemax</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header"><div class="container nav-wrap">
  <a class="logo" href="index.html">Cine<span>max</span></a>
  <button class="menu-btn" id="menuBtn">☰</button>
  <nav id="mainNav"><a href="index.html">Home</a><a class="active" href="movies.html">Movies</a><a href="favorites.html">Favorites</a><a href="reviews.html">Reviews</a><a href="contact.html">Contact</a><button class="theme-btn" id="themeBtn">☾</button></nav>
</div></header>
<main class="page">
  <div class="container">
    <div class="page-title"><p class="eyebrow">MOVIE LIBRARY</p><h1>All Movies</h1><p>Search, filter and sort the collection to find something worth watching.</p></div>
    <div class="filter-box">
      <input id="searchInput" type="search" placeholder="Search by title or keyword...">
      <select id="genreFilter"><option value="">All Genres</option></select>
      <select id="languageFilter"><option value="">All Languages</option></select>
      <select id="yearFilter"><option value="">All Years</option></select>
      <select id="ratingFilter"><option value="">Any Rating</option><option value="8">8+ Rating</option><option value="7">7+ Rating</option></select>
      <select id="sortSelect"><option value="name-asc">Name A–Z</option><option value="name-desc">Name Z–A</option><option value="rating-desc">Rating High–Low</option><option value="rating-asc">Rating Low–High</option><option value="year-desc">Newest First</option><option value="year-asc">Oldest First</option></select>
    </div>
    <div class="result-row"><span id="resultCount"></span><button class="small-btn" id="clearFilters">Clear Filters</button></div>
    <div class="movie-grid" id="movieGrid"></div>
    <div class="empty" id="emptyState" hidden>No movies match your search or filters.</div>
  </div>
</main>
<footer></footer>
<script src="js/movies.js"></script><script src="js/app.js"></script><script src="js/movies-page.js"></script>
</body>
</html>
