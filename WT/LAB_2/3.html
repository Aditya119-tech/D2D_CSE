<!-- Create an HTML document that uses <pre> and <code> tags to display preformatted text or code snippets exactly as typed. -->
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <pre>This is preformatted text.
            It preserves both spaces and line breaks.
        </pre>
        <code>
            function hhh() {
                console.log("Hello, World!");
            }  
        </code>                                 
    </body>
    </html>
