<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Media Query Demo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            background-color: #dbeafe;
            color: #1e3a8a;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            background: white;
        }

        .device {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .card {
            flex: 1;
            padding: 30px;
            background: #bfdbfe;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            body {
                background-color: #fecaca;
                color: #991b1b;
                padding: 15px;
            }

            .container {
                padding: 25px;
            }

            .cards {
                flex-direction: column;
            }

            .card {
                background-color: #fee2e2;
            }

            .device::after {
                content: "Mobile";
            }
        }

        @media (min-width: 601px) and (max-width: 1024px) {
            body {
                background-color: #fef3c7;
                color: #92400e;
            }

            .container {
                padding: 35px;
            }

            .cards {
                flex-wrap: wrap;
            }

            .card {
                flex: 1 1 45%;
                background-color: #fde68a;
            }

            .device::after {
                content: "Tablet";
            }
        }

        @media (min-width: 1025px) {
            body {
                background-color: #d1fae5;
                color: #065f46;
            }

            .container {
                padding: 50px;
            }

            .card {
                background-color: #a7f3d0;
            }

            .device::after {
                content: "Desktop";
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Responsive Webpage</h1>

        <p class="device">Device: </p>

        <p>
            Resize your browser window to see the background color
            and layout change.
        </p>

        <br>

        <div class="cards">
            <div class="card">
            </div>

            <div class="card">
            </div>

            <div class="card">
            </div>
        </div>
    </div>

</body>

</html>
