<!-- Address, B, U, I, Blockquote, Marquee, Link, Meta. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <address>
        John Doe<br>
        123 Main St.<br>
        Anytown, USA<br>
        <a href="mailto:john.doe@example.com">john.doe@example.com</a>
    </address>
    <p>This is <b>bold</b> text.</p>
    <p>This is <i>italic</i> text.</p>
    <p>This is <u>underlined</u> text.</p>
    <blockquote>
        "This is a blockquote. It is used to indicate that the enclosed text is an extended quotation."
    </blockquote>
    <marquee behavior="scroll" direction="left">This is a scrolling marquee text.</marquee>
    <a href="https://www.example.com">This is a link to example.com</a>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</body>

</html>
