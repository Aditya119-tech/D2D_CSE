<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>COVID-19 Vaccine Registration From</h1>
    <form >
        <table  cellpadding="10" >
            <tr>
                <td>First Name</td>
                <td><input type="text" size="40"/></td>
            </tr>
            <tr>
                <td>Last Name</td>
                <td><input type="text" size="40"/></td>
            </tr>
            <tr>
                <td>Aadhar Number</td>
                <td align="left"><input type="tel" pattern="^[0-9]{12}$/" size="40"/></td>
            </tr>
            <tr>
                <td>Vaccine Name </td>
                <td align="left"><select>
                    <option selected disabled >Select Vaccine</option>
                    <option>dzsfdsz</option>
                    <option>sdfsaef</option>
                    <option>easfdse</option>
                </select></td>  
            </tr>
            <tr>
                <td> Vaccine Center Name</td>
                <td align="left"><select>
                    <option selected disabled >Select Center</option>
                    <option>dzsfdsz</option>
                    <option>sdfsaef</option>
                    <option>easfdse</option>
                </select></td>  
            </tr>
            <tr>
                <td>Date of Dose</td>
                <td align="left"><input type="date" /></td>
            </tr>
            <tr>
                <td>Dose Number</td>
                <td align="left" ><input type="number" min="1"/></td>
                    
            </tr>
            
            <tr>
                <td colspan="2"><input type="submit" value="Click Here"/>
                <input type="button" value="Cancel"  /></td>
            </tr>
        </table>
    </form>
</body>
</html>
