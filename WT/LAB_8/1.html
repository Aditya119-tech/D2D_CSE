<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Design</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: "Times New Roman", serif;
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 650px;
            min-height: 365px;
            margin: 0 auto;
            border-left: 1px solid blue;
            border-right: 1px solid blue;
        }

        /* Header */
        .header {
            height: 42px;
            display: flex;
            border-top: 1px solid blue;
            border-bottom: 2px solid green;
        }

        .logo {
            width: 126px;
            height: 36px;
            border: 1px solid red;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .nav {
            flex: 1;
            display: flex;
            align-items: center;
            padding-left: 16px;
            gap: 18px;
        }

        .nav a {
            color: blue;
            font-size: 17px;
            text-decoration: underline;
        }

        /* Main content */
        .main {
            display: flex;
            min-height: 287px;
            border-bottom: 2px solid green;
        }

        /* Sidebar */
        .sidebar {
            width: 190px;
            padding: 11px 11px 20px 10px;
            border-right: 2px solid green;
        }

        .menu-button {
            width: 167px;
            height: 38px;
            margin-bottom: 12px;
            background: white;
            border: 1px solid #777;
            font-family: "Times New Roman", serif;
            font-size: 18px;
            cursor: pointer;
        }

        /* Content area */
        .content {
            flex: 1;
            padding: 19px 17px 25px 17px;
        }

        /* Top content box */
        .top-box {
            height: 112px;
            border: 2px solid purple;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px;
        }

        .top-item {
            width: 172px;
            height: 65px;
            border: 2px dotted red;
        }

        /* Bottom content box */
        .bottom-box {
            height: 112px;
            margin-top: 19px;
            border: 2px solid purple;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
        }

        .bottom-item {
            width: 107px;
            height: 65px;
            border: 2px dotted red;
        }

        /* Footer */
        .footer {
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                width: 100%;
            }

            .sidebar {
                width: 30%;
            }

            .menu-button {
                width: 100%;
                font-size: 15px;
            }

            .top-item {
                width: 42%;
            }

            .bottom-item {
                width: 28%;
            }

            .nav {
                gap: 10px;
                padding-left: 8px;
            }

            .nav a {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                Logo Here
            </div>

            <nav class="nav">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>

        <!-- Main -->
        <main class="main">

            <!-- Sidebar -->
            <aside class="sidebar">
                <button class="menu-button">RESULT</button>
                <button class="menu-button">APPLY</button>
                <button class="menu-button">PLACEMENT</button>
                <button class="menu-button">RECRUITMENT</button>
                <button class="menu-button">NEWS</button>
            </aside>

            <!-- Content -->
            <section class="content">

                <div class="top-box">
                    <div class="top-item"></div>
                    <div class="top-item"></div>
                </div>

                <div class="bottom-box">
                    <div class="bottom-item"></div>
                    <div class="bottom-item"></div>
                    <div class="bottom-item"></div>
                </div>

            </section>

        </main>

        <!-- Footer -->
        <footer class="footer">
            Footer
        </footer>

    </div>

</body>
</html>
