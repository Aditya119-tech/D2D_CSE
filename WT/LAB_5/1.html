<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Student Registration</h1>
    <form align="center">
        <table align="center" cellpadding="10" >
            <tr>
                <td>Full Name</td>
                <td><input type="text" size="40"/></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" size="40"/></td>
            </tr>
            <tr>
                <td>Address</td>
                <td align="left"><textarea rows="4" cols="38"></textarea></td>
            </tr>
            <tr>
                <td>Nationality </td>
                <td><input type="text" size="40"/></td>
            </tr>
            <tr>
                <td> Date of Birth </td>
                <td align="left" ><input type="date"/></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td align="left"><input type="radio" name="gender"/>Male
                <input type="radio" name="gender"/>Female</td>                
            </tr>
            <tr>
                <td>Highest Degree</td>
                <td align="left"><select>
                    <option selected disabled >Select Degree</option>
                    <option>M.Tech</option>
                    <option>B.Tech</option>
                    <option>Diploma</option>
                </select></td>      
            </tr>
            <tr>
                <td>CPI</td>
                <td><input type="tel" size="40" min="1" max="10" /></td>
            </tr>
            <tr>
                <td>University</td>
                <td><input type="text" size="40"/></td>
            </tr>
            <tr>
                <td>Passing Year</td>
                <td align="left"><select>
                    <option selected disabled >Select Year</option>
                    <option>2026</option>
                    <option>2025</option>
                    <option>2024</option>
                </select></td>      
            </tr>
            <tr>
                <td colspan="2"><input type="submit" align="center"/>
                <input type="button" value="Cancel"  /></td>
            </tr>
        </table>
    </form>
</body>
</html>
