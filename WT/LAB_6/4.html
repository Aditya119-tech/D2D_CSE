<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <table>
            <tr>
                <td>CPI</td>
                <td><input type="number" min="1" max="10" size="40" required > </td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" size="40" /></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" size="40" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}" required /></td>
            </tr>
           <tr>
                <td colspan="2"><input type="submit" align="center"/>
                <input type="button" value="Cancel"  /></td>
            </tr>
           
            
        </table>
    </form>
</body>
</html>
