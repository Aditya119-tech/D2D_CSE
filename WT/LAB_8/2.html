<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: serif;
        }

        body {
            background-color: #add8e6;
            padding: 10px;
        }

        /* Outer Page Box */
        .page-container {
            border: 1px solid #000;
            padding-top: 5px;
        }

        .page-title {
            padding-left: 5px;
            font-size: 14px;
            margin-bottom: 2px;
        }

        /* Purple Header */
        .header {
            background-color: #800080;
            color: white;
            padding: 4px 5px;
            font-size: 14px;
        }

        /* Orange Main Content Area */
        .main-container {
            background-color: #ffa500;
            padding: 15px 15px 60px 15px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .content-area {
            width: 60%;
        }

        .content-title {
            font-size: 14px;
            margin-bottom: 10px;
        }

        /* Black Entry Boxes */
        .entry {
            background-color: #000;
            color: white;
            padding: 5px 8px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        /* Black Sidebar Box */
        .sidebar {
            background-color: #000;
            color: white;
            width: 35%;
            height: 120px;
            padding: 8px;
            font-size: 14px;
        }

        /* Blue Footer */
        .footer {
            background-color: #0000ff;
            color: white;
            padding: 3px 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <div class="page-title">Page</div>
        
        <div class="header">Header</div>
        
        <div class="main-container">
            <div class="content-area">
                <div class="content-title">Content</div>
                <div class="entry">Entry</div>
                <div class="entry">Entry</div>
                <div class="entry">Entry</div>
            </div>
            
            <div class="sidebar">
                Sidebar
            </div>
        </div>
        
        <div class="footer">&copy;Darshan University-Rajkot</div>
    </div>

</body>
</html>
