<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul > li{
            color: blue;
            font-weight: bold;
        }
        h2 + p{
            color: green;
            font-style: italic;
        }
        input[type="text"]{
            border: 2px solid red;
            padding: 20px;
        }
    </style>
</head>
<body>
    <ul>
        <li>Lambhorgini</li>
        <li>Buggati</li>
        <li>Aston Martin</li>
    </ul>
    <h2>This Is Heading - 2 in Html</h2>
    <p>This Is paragraph Tag In Html</p>
    <input type="text" placeholder="Enter Something Here:">
</body>
</html>
